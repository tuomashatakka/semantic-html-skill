<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MDN VECTOR SPACE — synapse navigator</title>
<style>
  /* ── MONO tokens ─────────────────────────────────────────── */
  :root {
    --mono-void: #050507; --mono-ink: #0b0b10; --mono-onyx: #111118;
    --mono-graphite: #1a1a22; --mono-slate: #2a2a35;
    --fg1: #f4f4f8; --fg2: #c5c5d0; --fg3: #8888a0; --fg4: #555568;
    --accent-turquoise: #00e5d1; --accent-turquoise-glow: #5cffec;
    --accent-turquoise-muted: rgba(0,229,209,0.14);
    --accent-crimson: #ff2e7e; --accent-crimson-glow: #ff6aa8;
    --accent-violet: #c8b6ff; --accent-violet-glow: #e0d4ff;
    --border-soft: rgba(255,255,255,0.10);
    --backdrop-glass: blur(24px) saturate(140%);
    --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
    --duration-fast: 180ms; --duration-base: 320ms; --duration-slow: 600ms;
    --font-display: "Sofia Pro", "Montserrat", -apple-system, sans-serif;
    --font-sans: "Montserrat", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Monaco, monospace;
    --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--mono-ink); overflow: hidden;
    font-family: var(--font-sans); color: var(--fg2); }
  canvas#scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

  /* ── [data-wf] animated gradient edges (MONO wireframe) ──── */
  [data-wf] {
    --edge-c1: var(--accent-turquoise); --edge-c2: var(--accent-turquoise-glow);
    --edge-bright: var(--accent-turquoise-glow);
    --edge-h: 1px; --edge-nudge: 0px; --edge-pulse: 7s;
    position: relative; border: 0; isolation: isolate;
    background: rgba(17,17,24,0.55);
    backdrop-filter: var(--backdrop-glass); -webkit-backdrop-filter: var(--backdrop-glass);
    transition: background var(--duration-base) var(--ease-cinematic);
  }
  [data-wf]::before, [data-wf]::after {
    content: ""; position: absolute; left: 0; width: 100%; height: var(--edge-h);
    background: linear-gradient(90deg, transparent 0%, var(--edge-c1) 6%, var(--edge-c2) 22%,
      color-mix(in srgb, var(--edge-c1) 50%, transparent) 50%, transparent 70%),
      linear-gradient(90deg, color-mix(in srgb, var(--edge-c1) 12%, transparent),
                             color-mix(in srgb, var(--edge-c1) 12%, transparent));
    background-size: 200% 100%, 100% 100%; background-position: -40% 0, 0 0;
    pointer-events: none; z-index: 2;
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--edge-c1) 60%, transparent));
    animation: wfEdgeSweep var(--edge-pulse) var(--ease-cinematic) infinite;
    transition: transform var(--duration-slow) var(--ease-cinematic),
                filter var(--duration-base) var(--ease-cinematic);
  }
  [data-wf]::before { top: 0; }
  [data-wf]::after  { bottom: 0; transform: scaleX(-1); animation-direction: reverse; }
  [data-wf]:hover::before, [data-wf]:hover::after { filter: drop-shadow(0 0 12px var(--edge-bright)); }
  [data-edge="crimson"] { --edge-c1: var(--accent-crimson); --edge-c2: var(--accent-crimson-glow); --edge-bright: var(--accent-crimson-glow); }
  @keyframes wfEdgeSweep { 0% { background-position: -40% 0, 0 0; } 50% { background-position: 110% 0, 0 0; } 100% { background-position: -40% 0, 0 0; } }

  /* ── HUD layout ──────────────────────────────────────────── */
  .hud { position: fixed; z-index: 10; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  #panel-top { top: var(--sp-4); left: var(--sp-4); width: min(340px, calc(100vw - 32px));
    padding: var(--sp-4) var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-3); }
  .brand { display: flex; align-items: baseline; gap: var(--sp-3); }
  .brand h1 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase; color: var(--fg1); }
  .brand .tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent-turquoise); }
  .statline { display: flex; gap: var(--sp-4); font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.08em; color: var(--fg3); }
  .statline b { color: var(--fg1); font-weight: 500; }
  .statline .live { color: var(--accent-turquoise); }
  .statline .live::before { content: "●"; margin-right: 5px; animation: blink 2.4s var(--ease-cinematic) infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }
  .wf-bar { position: relative; height: 2px; background: rgba(255,255,255,0.08); overflow: hidden; display: none; }
  .wf-bar > i { display: block; position: absolute; inset: 0 auto 0 0; width: var(--v, 0%);
    background: linear-gradient(90deg, var(--accent-turquoise) 0%, var(--accent-violet) 100%);
    transition: width var(--duration-slow) var(--ease-cinematic); }

  #q { width: 100%; padding: var(--sp-2) 0; background: transparent; border: 0;
    border-bottom: 1px solid var(--border-soft); outline: none;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--fg1);
    transition: border-color var(--duration-base) var(--ease-cinematic); }
  #q::placeholder { color: var(--fg4); letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; }
  #q:focus { border-color: var(--accent-turquoise); }

  #results { display: flex; flex-direction: column; max-height: 38vh; overflow-y: auto; scrollbar-width: thin; }
  .hit { padding: var(--sp-2) 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
    opacity: 0; transform: translateY(6px); animation: hitIn 0.5s var(--ease-cinematic) forwards;
    animation-delay: calc(var(--i) * 60ms); }
  @keyframes hitIn { to { opacity: 1; transform: none; } }
  .hit:hover .t, .hit[data-active] .t { color: var(--accent-crimson-glow); }
  .hit .t { font-family: var(--font-sans); font-size: 12px; color: var(--fg1);
    transition: color var(--duration-fast) var(--ease-cinematic); }
  .hit .m { font-family: var(--font-mono); font-size: 9px; color: var(--fg4); letter-spacing: 0.06em;
    display: flex; gap: var(--sp-2); margin-top: 2px; }
  .hit .m .s { color: var(--accent-crimson); }

  #panel-node { right: var(--sp-4); top: var(--sp-4); width: min(320px, calc(100vw - 32px));
    padding: var(--sp-4) var(--sp-6); display: none; flex-direction: column; gap: var(--sp-2); }
  #panel-node.show { display: flex; }
  #panel-node .k { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--accent-turquoise); }
  #panel-node h2 { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 600;
    color: var(--fg1); letter-spacing: -0.01em; }
  #panel-node .path { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg3);
    word-break: break-all; line-height: 1.5; }
  #panel-node .snippet { font-size: 11px; line-height: 1.6; color: var(--fg2); max-height: 90px; overflow: hidden;
    mask-image: linear-gradient(to bottom, black 60%, transparent 100%); }
  #panel-node .open { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--fg3); }
  #panel-node .open b { color: var(--accent-turquoise); font-weight: 500; }

  #hints { bottom: var(--sp-4); left: 50%; transform: translateX(-50%);
    padding: var(--sp-2) var(--sp-4); display: flex; gap: var(--sp-4); white-space: nowrap;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; color: var(--fg4);
    text-transform: uppercase; }
  #hints kbd { color: var(--fg2); font-family: inherit; border: 1px solid var(--border-soft);
    border-radius: 0; padding: 1px 5px; margin-right: 4px; background: var(--mono-onyx); }
  @media (max-width: 640px) { #hints .kbonly { display: none; } }

  /* floating node label */
  #nlabel { position: fixed; z-index: 5; pointer-events: none; font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 0.06em; color: var(--accent-turquoise-glow);
    text-shadow: 0 0 8px var(--accent-turquoise-muted), 0 1px 2px #000;
    transform: translate(-50%, -160%); white-space: nowrap; opacity: 0;
    transition: opacity var(--duration-base) var(--ease-cinematic); }

  /* ── triangle spinner (MONO) ─────────────────────────────── */
  #loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
    background: var(--mono-ink); transition: opacity var(--duration-slow) var(--ease-cinematic); }
  #loader.gone { opacity: 0; pointer-events: none; }
  .wf-tri-spin { --size: 56px; width: var(--size); height: var(--size); position: relative; transform: rotate(-12deg); }
  .wf-tri-spin svg { width: 100%; height: 100%; overflow: visible; }
  .wf-tri-spin .base { fill: none; stroke: var(--border-soft); stroke-width: 1; }
  .wf-tri-spin .trace { fill: none; stroke: var(--accent-turquoise); stroke-width: 2.2;
    stroke-dasharray: 0 var(--peri, 300); filter: drop-shadow(0 0 6px var(--accent-turquoise-muted));
    animation: wfTriTrace 2s linear infinite; }
  @keyframes wfTriTrace {
    0%   { stroke-dasharray: 0 var(--peri, 300); stroke-dashoffset: 0; }
    50%  { stroke-dasharray: var(--peri, 300) var(--peri, 300); stroke-dashoffset: 0; }
    100% { stroke-dasharray: 0 var(--peri, 300); stroke-dashoffset: calc(var(--peri, 300) * 1); }
  }
  #loader .ld { margin-top: var(--sp-4); font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg4); text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    [data-wf]::before, [data-wf]::after { animation: none; }
    .statline .live::before { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud" id="panel-top" data-wf>
  <div class="brand"><h1>MDN Vectors</h1><span class="tag">synapse&nbsp;navigator</span></div>
  <div class="statline">
    <span class="live" id="st-state">connecting</span>
    <span><b id="st-docs">—</b>&nbsp;docs</span>
    <span><b id="st-nodes">—</b>&nbsp;sampled</span>
  </div>
  <div class="wf-bar" id="ingest-bar"><i></i></div>
  <input id="q" type="search" autocomplete="off" spellcheck="false"
         placeholder="semantic search — press /" />
  <div id="results"></div>
</div>

<div class="hud" id="panel-node" data-wf>
  <span class="k" id="n-k">node</span>
  <h2 id="n-title"></h2>
  <div class="path" id="n-path"></div>
  <div class="snippet" id="n-snippet"></div>
  <div class="open"><b>enter</b> open on MDN · <b>esc</b> release</div>
</div>

<div class="hud" id="hints" data-wf>
  <span class="kbonly"><kbd>←↑↓→</kbd>traverse</span>
  <span><kbd>↵</kbd>open</span>
  <span><kbd>esc</kbd>clear</span>
  <span><kbd>/</kbd>search</span>
  <span>drag·orbit&nbsp;&nbsp;pinch·zoom&nbsp;&nbsp;tap·focus</span>
</div>

<div id="nlabel"></div>

<div id="loader">
  <div>
    <div class="wf-tri-spin" style="--peri:248">
      <svg viewBox="0 0 100 100"><path class="base" d="M50 8 L95 88 L5 88 Z"/><path class="trace" d="M50 8 L95 88 L5 88 Z"/></svg>
    </div>
    <div class="ld" id="ld-msg">sampling embeddings</div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.184.0'

// Works when opened directly from file:// too — point the API at the
// local viewer_server (override with ?api=http://host:port if needed).
const API = new URLSearchParams(location.search).get('api')
  ?? (location.protocol === 'file:' ? 'http://localhost:7341' : '')

const TOKENS = {
  ink: 0x0b0b10, fg1: 0xf4f4f8,
  turquoise: 0x00e5d1, turquoiseGlow: 0x5cffec,
  crimson: 0xff2e7e, crimsonGlow: 0xff6aa8, violet: 0xc8b6ff,
}
const DIM_LINK = new THREE.Color(0xffffff).multiplyScalar(0.10)
const FADE_LINK = new THREE.Color(0xffffff).multiplyScalar(0.035)
const LIT  = new THREE.Color(TOKENS.turquoise)
const LIT2 = new THREE.Color(TOKENS.turquoise).multiplyScalar(0.33)
const HIT  = new THREE.Color(TOKENS.crimson)
const NODE_BASE = new THREE.Color(TOKENS.fg1).multiplyScalar(0.8)
const NODE_FADE = new THREE.Color(TOKENS.fg1).multiplyScalar(0.14)

const $ = id => document.getElementById(id)
const canvas = $('scene')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
const scene = new THREE.Scene()
scene.background = new THREE.Color(TOKENS.ink)
scene.fog = new THREE.Fog(TOKENS.ink, 14, 30)
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 200)
camera.position.set(0, 4, 13)
const camTarget = new THREE.Vector3(), camGoal = new THREE.Vector3()
let camDist = 13, camDistGoal = 13, theta = 0.6, phi = 1.15

// ── graph state ────────────────────────────────────────────────
let nodes = [], links = [], adj = []
let positions = []           // THREE.Vector3 per node
let nodeMesh, lineSeg, lineColors, linePos
let focusIdx = -1, hoverIdx = -1
let searchHits = new Map()   // idx -> rank
let pulses = []              // ripple flashes {idx, t0, isLink?}
let linkPulses = []
let introT0 = 0
const CAPACITY_PAD = 64, LINK_PAD = CAPACITY_PAD * 3
const dummy = new THREE.Object3D()
const glowTex = makeGlowTexture()
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: TOKENS.turquoise, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false }))
glow.scale.set(1.6, 1.6, 1)
scene.add(glow)

function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128
  const g = c.getContext('2d')
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64)
  grad.addColorStop(0, 'rgba(255,255,255,0.9)'); grad.addColorStop(0.35, 'rgba(255,255,255,0.25)')
  grad.addColorStop(1, 'rgba(255,255,255,0)')
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128)
  return new THREE.CanvasTexture(c)
}

function buildScene(graph) {
  nodes = graph.nodes
  links = graph.links
  positions = nodes.map(n => new THREE.Vector3(n.p[0], n.p[1], n.p[2]))
  adj = nodes.map(() => [])
  links.forEach(([a, b], li) => { adj[a].push({ n: b, l: li }); adj[b].push({ n: a, l: li }) })

  if (nodeMesh) { scene.remove(nodeMesh); nodeMesh.geometry.dispose() }
  if (lineSeg) { scene.remove(lineSeg); lineSeg.geometry.dispose() }

  const cap = nodes.length + CAPACITY_PAD
  nodeMesh = new THREE.InstancedMesh(
    new THREE.SphereGeometry(0.065, 10, 10),
    new THREE.MeshBasicMaterial({ toneMapped: false }), cap)
  nodeMesh.count = nodes.length
  for (let i = 0; i < nodes.length; i++) setNodeMatrix(i, 1)
  scene.add(nodeMesh)

  const lcap = (links.length + LINK_PAD) * 2
  linePos = new Float32Array(lcap * 3)
  lineColors = new Float32Array(lcap * 3)
  links.forEach(([a, b], i) => writeLinkPos(i, a, b))
  const lg = new THREE.BufferGeometry()
  lg.setAttribute('position', new THREE.BufferAttribute(linePos, 3))
  lg.setAttribute('color', new THREE.BufferAttribute(lineColors, 3))
  lg.setDrawRange(0, links.length * 2)
  lineSeg = new THREE.LineSegments(lg,
    new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, toneMapped: false }))
  scene.add(lineSeg)

  repaint()
  introT0 = performance.now()
  $('st-nodes').textContent = nodes.length
}

function setNodeMatrix(i, s) {
  dummy.position.copy(positions[i]); dummy.scale.setScalar(s)
  dummy.updateMatrix(); nodeMesh.setMatrixAt(i, dummy.matrix)
}
function writeLinkPos(li, a, b) {
  positions[a].toArray(linePos, li * 6)
  positions[b].toArray(linePos, li * 6 + 3)
}
function setLinkColor(li, color, alpha = 1) {
  const c = _tmpC.copy(color).multiplyScalar(alpha)
  c.toArray(lineColors, li * 6); c.toArray(lineColors, li * 6 + 3)
}
const _tmpC = new THREE.Color()

// ── relation map: lit / lit2 / dim (the .wf-nn pattern) ───────
function repaint() {
  const active = hoverIdx >= 0 ? hoverIdx : focusIdx
  const isActive = active >= 0
  const ring1 = new Set(), ring1Links = new Set(), ring2Links = new Set()
  if (isActive) {
    for (const e of adj[active]) { ring1.add(e.n); ring1Links.add(e.l) }
    for (const n1 of ring1) for (const e of adj[n1])
      if (!ring1Links.has(e.l)) ring2Links.add(e.l)
  }
  for (let i = 0; i < nodes.length; i++) {
    let c
    if (searchHits.has(i)) c = i === active ? new THREE.Color(TOKENS.crimsonGlow) : HIT
    else if (!isActive) c = NODE_BASE
    else if (i === active) c = new THREE.Color(TOKENS.turquoiseGlow)
    else if (ring1.has(i)) c = LIT
    else c = NODE_FADE
    nodeMesh.setColorAt(i, c)
    setNodeMatrix(i, i === active ? 2.2 : ring1.has(i) ? 1.4 : 1)
  }
  nodeMesh.instanceColor.needsUpdate = true
  nodeMesh.instanceMatrix.needsUpdate = true

  for (let li = 0; li < links.length; li++) {
    if (!isActive) setLinkColor(li, DIM_LINK)
    else if (ring1Links.has(li)) setLinkColor(li, LIT)
    else if (ring2Links.has(li)) setLinkColor(li, LIT2)
    else setLinkColor(li, FADE_LINK)
  }
  lineSeg.geometry.attributes.color.needsUpdate = true

  if (focusIdx >= 0) {
    glow.position.copy(positions[focusIdx])
    glow.material.color.setHex(searchHits.has(focusIdx) ? TOKENS.crimson : TOKENS.turquoise)
    glow.material.opacity = 0.55
  } else glow.material.opacity = 0
}

// ── focus / panel ──────────────────────────────────────────────
function setFocus(i, { fly = true, snippet = null } = {}) {
  focusIdx = i
  const p = $('panel-node'), label = $('nlabel')
  if (i < 0) { p.classList.remove('show'); label.style.opacity = 0; repaint(); return }
  const n = nodes[i]
  $('n-k').textContent = searchHits.has(i) ? `search hit · rank ${searchHits.get(i) + 1}` : `node · ${n.id.slice(0, 12)}`
  $('n-title').textContent = n.title
  $('n-path').textContent = n.path
  $('n-snippet').textContent = snippet ?? (n.snippet ?? '')
  p.classList.add('show')
  label.textContent = n.title
  label.style.opacity = 1
  if (fly) { camGoal.copy(positions[i]); camDistGoal = Math.max(5.5, camDist * 0.82) }
  ripple(i)
  repaint()
}

// ── ripple: BFS flash propagating ring-by-ring (wfRipple) ─────
function ripple(start) {
  const seen = new Set([start]); let frontier = [start]
  const now = performance.now()
  pulses.push({ idx: start, t0: now })
  for (let d = 1; d <= 4 && frontier.length; d++) {
    const next = []
    for (const u of frontier) for (const e of adj[u]) {
      linkPulses.push({ li: e.l, t0: now + d * 90 - 45 })
      if (!seen.has(e.n)) { seen.add(e.n); next.push(e.n); pulses.push({ idx: e.n, t0: now + d * 90 }) }
    }
    frontier = next
  }
}

// ── pointer: orbit / pinch / raycast tap ──────────────────────
const ray = new THREE.Raycaster(); ray.params.Mesh = {}
const ptr = new THREE.Vector2()
const pointers = new Map()
let dragMoved = 0, rotVel = { x: 0, y: 0 }, pinchD0 = 0

canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
  dragMoved = 0
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()]
    pinchD0 = Math.hypot(a.x - b.x, a.y - b.y)
  }
  canvas.setPointerCapture(e.pointerId)
})
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) {
    const prev = pointers.get(e.pointerId)
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
    dragMoved += Math.abs(dx) + Math.abs(dy)
    if (pointers.size === 1) { rotVel.y = dx * 0.006; rotVel.x = dy * 0.006 }
    else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()]
      const d = Math.hypot(a.x - b.x, a.y - b.y)
      camDistGoal = THREE.MathUtils.clamp(camDistGoal * (pinchD0 / Math.max(1, d)), 3, 26)
      pinchD0 = d
    }
  } else if (e.pointerType === 'mouse') {        // hover relation map
    const i = pick(e.clientX, e.clientY)
    if (i !== hoverIdx) { hoverIdx = i; canvas.style.cursor = i >= 0 ? 'pointer' : 'grab'; repaint() }
  }
})
function endPtr(e) {
  if (pointers.has(e.pointerId) && pointers.size === 1 && dragMoved < 8) {
    const i = pick(e.clientX, e.clientY)
    if (i >= 0) setFocus(i)
    else if (focusIdx >= 0) setFocus(-1)
  }
  pointers.delete(e.pointerId)
}
canvas.addEventListener('pointerup', endPtr)
canvas.addEventListener('pointercancel', e => pointers.delete(e.pointerId))
canvas.addEventListener('wheel', e => {
  e.preventDefault()
  camDistGoal = THREE.MathUtils.clamp(camDistGoal * (1 + e.deltaY * 0.0012), 3, 26)
}, { passive: false })

function pick(cx, cy) {
  if (!nodeMesh) return -1
  ptr.x = (cx / innerWidth) * 2 - 1; ptr.y = -(cy / innerHeight) * 2 + 1
  ray.setFromCamera(ptr, camera)
  ray.params.Points = { threshold: 0.2 }
  const hit = ray.intersectObject(nodeMesh)[0]
  return hit ? hit.instanceId : -1
}

// ── keyboard: arrows traverse synapses, enter opens, esc clears
const ARROWS = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }
addEventListener('keydown', e => {
  const typing = document.activeElement === $('q')
  if (e.key === 'Escape') {
    if (typing) { $('q').blur(); return }
    clearSearch(); setFocus(-1); return
  }
  if (typing) return
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return }
  if (e.key === 'Enter' && focusIdx >= 0) { open(nodes[focusIdx].url, '_blank'); return }
  if (ARROWS[e.key]) {
    e.preventDefault()
    if (focusIdx < 0) { setFocus(nearestToCenter()); return }
    const next = bestNeighbor(focusIdx, ARROWS[e.key])
    if (next >= 0) setFocus(next)
  }
})

function toScreen(v) {
  const p = v.clone().project(camera)
  return [(p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight]
}
function nearestToCenter() {
  let best = -1, bd = Infinity
  for (let i = 0; i < nodes.length; i++) {
    const [x, y] = toScreen(positions[i])
    const d = (x - innerWidth / 2) ** 2 + (y - innerHeight / 2) ** 2
    if (d < bd) { bd = d; best = i }
  }
  return best
}
function bestNeighbor(i, dir) {
  const [fx, fy] = toScreen(positions[i])
  let best = -1, bs = 0.3                       // require decent direction match
  for (const e of adj[i]) {
    const [x, y] = toScreen(positions[e.n])
    const dx = x - fx, dy = y - fy
    const len = Math.hypot(dx, dy) || 1
    const score = (dx * dir[0] + dy * dir[1]) / len
    if (score > bs) { bs = score; best = e.n }
  }
  return best
}

// ── search: live reranked hits, crimson highlight, splice-in ──
let qTimer
$('q').addEventListener('input', () => {
  clearTimeout(qTimer)
  const v = $('q').value.trim()
  if (!v) { clearSearch(); return }
  qTimer = setTimeout(() => runSearch(v), 350)
})
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(qTimer); runSearch($('q').value.trim()); $('q').blur() }
})

function clearSearch() {
  searchHits.clear(); $('results').innerHTML = ''; repaint()
}

async function runSearch(q) {
  if (!q) return
  $('results').innerHTML = `<div class="hit" style="--i:0"><span class="m">searching…</span></div>`
  const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => null)
  if (!res || res.error) { $('results').innerHTML = ''; return }
  searchHits.clear()
  const box = $('results'); box.innerHTML = ''
  res.results.forEach((hit, rank) => {
    let idx = hit.graph_index
    if (idx === undefined) idx = splice(hit)     // node outside sample → add it live
    else Object.assign(nodes[idx], { snippet: hit.snippet })
    searchHits.set(idx, rank)
    const el = document.createElement('div')
    el.className = 'hit'; el.style.setProperty('--i', rank)
    el.innerHTML = `<div class="t"></div>
      <div class="m"><span class="s">${(hit.rerank_score ?? hit.score ?? 0).toFixed(2)}</span><span></span></div>`
    el.querySelector('.t').textContent = hit.title
    el.querySelector('.m span:last-child').textContent = hit.path
    el.addEventListener('click', () => setFocus(idx, { snippet: hit.snippet }))
    box.appendChild(el)
  })
  const top = [...searchHits.entries()].find(([, r]) => r === 0)
  if (top) setFocus(top[0], { snippet: res.results[0].snippet })
  else repaint()
}

function splice(hit) {
  const i = nodes.length
  if (i >= nodes.length + CAPACITY_PAD - 1 || i >= nodeMesh.instanceMatrix.count) return 0
  nodes.push({ ...hit, p: hit.p })
  positions.push(new THREE.Vector3(...hit.p))
  adj.push([])
  nodeMesh.count = nodes.length
  setNodeMatrix(i, 1)
  for (const [j] of (hit.attach || [])) {
    const li = links.length
    if ((li + 1) * 6 > linePos.length) break
    links.push([i, j]); adj[i].push({ n: j, l: li }); adj[j].push({ n: i, l: li })
    writeLinkPos(li, i, j); setLinkColor(li, DIM_LINK)
  }
  lineSeg.geometry.setDrawRange(0, links.length * 2)
  lineSeg.geometry.attributes.position.needsUpdate = true
  lineSeg.geometry.attributes.color.needsUpdate = true
  return i
}

// ── live status polling ───────────────────────────────────────
async function poll() {
  const s = await fetch(`${API}/api/status`).then(r => r.json()).catch(() => null)
  if (s) {
    $('st-state').textContent = s.state
    if (s.doc_count != null) $('st-docs').textContent = s.doc_count.toLocaleString()
    const bar = $('ingest-bar')
    if (['fetching', 'indexing', 'embedding'].includes(s.state) && s.total) {
      bar.style.display = 'block'
      bar.firstElementChild.style.width = (100 * s.done / s.total).toFixed(1) + '%'
      $('st-docs').textContent = `${s.done}/${s.total}`
    } else bar.style.display = 'none'
  }
  setTimeout(poll, 4000)
}

// ── render loop ───────────────────────────────────────────────
let _lastT = performance.now()
function bell(age, dur = 420) {                  // wfRipple 42% midpoint bell
  if (age < 0 || age > dur) return 0
  const t = age / dur
  return t < 0.42 ? t / 0.42 : 1 - (t - 0.42) / 0.58
}

function animate() {
  const now = performance.now()
  const dt = Math.min(0.05, (now - _lastT) / 1000); _lastT = now

  theta += rotVel.y * dt * 12; phi = THREE.MathUtils.clamp(phi + rotVel.x * dt * 12, 0.15, Math.PI - 0.15)
  rotVel.x *= 0.92; rotVel.y *= 0.92
  camDist += (camDistGoal - camDist) * Math.min(1, dt * 4)
  camTarget.lerp(camGoal, Math.min(1, dt * 3))
  camera.position.set(
    camTarget.x + camDist * Math.sin(phi) * Math.sin(theta),
    camTarget.y + camDist * Math.cos(phi),
    camTarget.z + camDist * Math.sin(phi) * Math.cos(theta))
  camera.lookAt(camTarget)

  // intro draw-on: links fade in, nodes scale in staggered
  if (introT0 && nodeMesh) {
    const t = (now - introT0) / 1400
    lineSeg.material.opacity = Math.min(1, t)
    if (t >= 1) introT0 = 0
  }

  // ripple pulses on top of base paint
  if (pulses.length || linkPulses.length) {
    let dirty = false
    pulses = pulses.filter(p => {
      const k = bell(now - p.t0)
      if (now - p.t0 > 440) { setNodeMatrix(p.idx, baseScale(p.idx)); dirty = true; return false }
      if (k > 0) {
        nodeMesh.setColorAt(p.idx, _tmpC.set(TOKENS.turquoiseGlow).lerp(NODE_BASE, 1 - k))
        setNodeMatrix(p.idx, baseScale(p.idx) + k * 1.2); dirty = true
      }
      return true
    })
    linkPulses = linkPulses.filter(p => {
      const k = bell(now - p.t0)
      if (now - p.t0 > 440) { dirty = true; return false }
      if (k > 0) { setLinkColor(p.li, _tmpC.set(TOKENS.turquoise), 0.10 + 0.9 * k); dirty = true }
      return true
    })
    if (dirty) {
      nodeMesh.instanceColor.needsUpdate = true
      nodeMesh.instanceMatrix.needsUpdate = true
      lineSeg.geometry.attributes.color.needsUpdate = true
      if (!pulses.length && !linkPulses.length) repaint()
    }
  }

  // floating label follows focus
  if (focusIdx >= 0) {
    const [x, y] = toScreen(positions[focusIdx])
    const l = $('nlabel'); l.style.left = x + 'px'; l.style.top = y + 'px'
  }

  renderer.render(scene, camera)
  requestAnimationFrame(animate)
}
function baseScale(i) {
  const active = hoverIdx >= 0 ? hoverIdx : focusIdx
  return i === active ? 2.2 : (active >= 0 && adj[active]?.some(e => e.n === i)) ? 1.4 : 1
}

new ResizeObserver(() => {
  renderer.setSize(innerWidth, innerHeight, false)
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
}).observe(document.body)

// ── boot ──────────────────────────────────────────────────────
async function boot() {
  poll()
  try {
    const n = Math.min(600, innerWidth < 700 ? 250 : 420)
    const graph = await fetch(`${API}/api/graph?n=${n}&k=3`).then(r => r.json())
    if (graph.error) { $('ld-msg').textContent = graph.error; setTimeout(boot, 5000); return }
    buildScene(graph)
    $('loader').classList.add('gone')
  } catch (err) {
    $('ld-msg').textContent = 'index building — retrying'
    setTimeout(boot, 5000)
  }
}
renderer.setSize(innerWidth, innerHeight, false)
camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix()
animate()
boot()
</script>
</body>
</html>
