<!doctype html>
<!--
  document-shell — the <head> every page needs.
  Keep: lang, charset first, viewport (never disable zoom), unique <title>,
  description, color-scheme (native dark controls + light-dark()), one stylesheet.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page title – Site name</title>
  <meta name="description" content="One-sentence summary of this page for search results and link previews.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">

  <link rel="canonical" href="https://example.com/page">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Open Graph / social previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Page title">
  <meta property="og:description" content="One-sentence summary.">
  <meta property="og:url" content="https://example.com/page">
  <meta property="og:image" content="https://example.com/og.png">

  <!-- Preload only what is on the critical path -->
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/main.css">

  <!-- Scripts: modules are deferred by default; never block parsing -->
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>…</header>
  <main id="main">
    <h1>Page title</h1>
  </main>
  <footer>…</footer>
</body>
</html>
