<!doctype html>
<!--
  forms-sign-in — labels, autocomplete tokens for password managers, native validation, :user-invalid errors.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – Templates</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main id="main">
    <h1>Sign in</h1>
    <form action="/session" method="post">
      <div class="field">
        <label for="si-email">Email</label>
        <input id="si-email" name="email" type="email" autocomplete="username" required aria-describedby="si-email-err">
        <p id="si-email-err" class="error">Enter the email you signed up with.</p>
      </div>
      <div class="field">
        <label for="si-pw">Password</label>
        <input id="si-pw" name="password" type="password" autocomplete="current-password" required aria-describedby="si-pw-err">
        <p id="si-pw-err" class="error">Enter your password.</p>
      </div>
      <div class="choices">
        <label><input type="checkbox" name="remember"> Keep me signed in</label>
      </div>
      <footer>
        <button type="submit" class="primary">Sign in</button>
        <a href="/reset-password">Forgot password?</a>
      </footer>
    </form>
    <p>New here? <a href="/sign-up">Create an account</a></p>
  </main>
</body>
</html>
